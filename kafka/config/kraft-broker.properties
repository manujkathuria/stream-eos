# ==============================================================================
# Apache Kafka 4.x Local KRaft Configuration (Single Broker)
# ==============================================================================

# Role & Node Identity
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093

# Listeners
# Expose PLAINTEXT at localhost:9092 for client applications and CONTROLLER at localhost:9093
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL

# Network & IO Threads
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Dedicated project data directory (inside kafka/data/kafka)
log.dirs=/Users/manujkathuria/workspace/stream-eos/kafka/data/kafka

# Default Partition & Threading
num.partitions=1
num.recovery.threads.per.data.dir=2

# Single-Broker Configurations for Offsets and Transactions
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Share Coordinator (Kafka 4.x)
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# Log Retention Policies
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
